<body>
  <div id="__bundler_placeholder">Loading Rede Escola Digital...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r: #482683\">É essa oportunidade que queremos apresentar a você.<\u002Fp>\n<p class=\"p\">Com a Rede Escola Digital, a proposta é permitir que empreendedores desenvolvam uma operação comercial no mercado de educação continuada, utilizando ferramentas, processos e uma marca padronizada.<\u002Fp>\n<p class=\"p\">Você não precisa desenvolver dezenas de cursos, contratar professores ou construir uma plataforma de ensino.<\u002Fp>\n<p class=\"p\">Essas estruturas fazem parte do ecossistema da rede e da instituição acadêmica parceira.<\u002Fp>\n<p class=\"p\" style=\"margin-bottom: 0\">Seu papel será desenvolver o negócio, divulgar as oportunidades educacionais e conquistar clientes por meio das atividades comerciais autorizadas.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 48px; background: #FCBF20; border-radius: 999px 32px 32px 999px; padding: clamp(28px, 4vw, 44px) clamp(28px, 5vw, 64px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 20px 48px; align-items: center\">\n<p style=\"margin: 0; font-size: clamp(20px, 2.2vw, 26px); line-height: 1.3; font-weight: 800; color: #482683\">E o melhor: você não precisa ser professor ou especialista em educação para empreender nesse mercado.<\u002Fp>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #482683; font-weight: 500\">Você precisa ter disposição para aprender, capacidade de gestão e interesse em construir um negócio de verdade.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SEÇÃO 3 | APRESENTAÇÃO DO NEGÓCIO ================= -->\n<section id=\"estrutura\" style=\"background: #F4F1FA; padding: 96px 24px\">\n<div style=\"max-width: 1180px; margin: 0 auto\">\n<div style=\"max-width: 820px; margin-bottom: 48px\">\n<p class=\"eyebrow\">Apresentação do negócio<\u002Fp>\n<h2 class=\"h2\">Sua escola digital. Sua operação. Uma estrutura pronta para começar.<\u002Fh2>\n<p class=\"h3\">Um modelo desenvolvido para quem quer emp <span style=\"flex: none; width: 28px; height: 28px; border-radius: 99px; background: #24B094; display: flex; align-items: center; justify-content: center; margin-top: -1px\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Ferramentas para gestão de oportunidades.<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #fff\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 99px; background: #24B094; display: flex; align-items: center; justify-content: center; margin-top: -1px\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Treinamento inicial e suporte tecnológico.<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #fff\"><span style=\"flex: none; width: 28px; height: 28px; border-radius: 99px; background: #24B094; display: flex; align-items: center; justify-content: center; margin-top: -1px\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Processos padronizados para desenvolver o negócio.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"strong-line\" style=\"text-align: center; margin-top: 48px\">A estrutura já tem um caminho definido. Seu desafio será fazer o negócio acontecer.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SEÇÃO 5 | MODELO DE REMUNERAÇÃO ================= -->\n<section id=\"remuneracao\" class=\"on-dark\" style=\"position: relative; overflow: hidden; background: #482683; padding: 104px 24px 96px\">\n<div aria-hidden=\"true\" style=\"position: absolute; left: -140px; bottom: -40px; width: 520px; height: 110px; border-radius: 99px; background: #24B094; transform: rotate(-45deg); opacity: .22\"><\u002Fdiv>\n<div style=\"position: relative; max-width: 1180px; margin: 0 auto\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 56px; align-items: start\">\n<div>\n<p class=\"eyebrow\">Modelo de remuneração<\u002Fp>\n<h2 class=\"h2\">Você desenvolve as vendas. E <span class=\"hl\">participa do faturamento.<\u002Fspan><\u002Fh2>\n<p class=\"h3\">Um modelo comercial criado para conectar o crescimento da sua operação à sua remuneração.<\u002Fp>\n<p class=\"p\">A proposta da Rede Escola Digital é que o parceiro receba <strong>50% do faturamento elegível gerado pelas vendas atribuídas à sua operação<\u002Fstrong>, conforme as condições comerciais aprovadas e previstas em contrato.<\u002Fp>\n<p class=\"p\">Isso significa que, quanto maior for o volume de vendas válidas da sua operação, maior poderá ser sua remuneração.<\u002Fp>\n<p class=\"p\" style=\"margin-bottom: 0\">Você poderá desenvolver estratégias comerciais, construir relacionamentos em sua região e trabalhar para ampliar sua carteira de clientes.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #fff; border-radius: 32px; padding: clamp(26px, 4vw, 42px); box-shadow: 0 24px 60px rgba(20,8,50,.35)\">\n<p style=\"margin: 0 0 12px; font-size: 18px; font-weight: 800; color: #482683; line-height: 1.35\">Veja um exemplo de como a participação funcionaria:<\u002Fp>\n<p style=\"margin: 0 0 24px; font-size: 16px; line-height: 1.6; color: #3B3550\">Se o valor de um curso for R$ 2.000 e a base de cálculo contratada corresponder integralmente a esse valor:<\u002Fp>\n<div style=\"display: grid; gap: 12px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 22px; border-radius: 18px; background: #F4F1FA\">\n<span style=\"font-size: 16px; font-weight: 600; color: #3B3550\">Valor da venda<\u002Fspan>\n<span style=\"font-size: 24px; font-weight: 800; color: #482683; white-space: nowrap\">R$ 2.000<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 22px; border-radius: 18px; background: #F4F1FA\">\n<span style=\"font-size: 16px; font-weight: 600; color: #3B3550\">Participação hipotética do parceiro<\u002Fspan>\n<span style=\"font-size: 24px; font-weight: 800; color: #482683; white-space: nowrap\">50%<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px; border-radius: 18px; background: #FCBF20\">\n<span style=\"font-size: 16px; font-weight: 700; color: #482683\">Remuneração correspondente<\u002Fspan>\n<span style=\"font-size: 30px; font-weight: 800; color: #482683; white-space: nowrap\">R$ 1.000<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 56px; max-width: 860px\">\n<p class=\"p\">Agora imagine construir uma operação com diferentes cursos e um fluxo contínuo de interessados.<\u002Fp>\n<p class=\"p\">O crescimento dependerá da sua capacidade comercial, da demanda, do investimento em divulgação e das condições efetivas do programa.<\u002Fp>\n<p class=\"strong-line\">Seu resultado será consequência do negócio que você desenvolver.<\u002Fp>\n<p class=\"small\" style=\"margin: 28px 0 32px; font-style: italic; color: rgba(255,255,255,.88)\">Os valores são apenas ilustrativos. A participação financeira, sua base de cálculo, condições de apuração e repasse dependem de aprovação jurídica e instrumento contratual. Não há garantia de faturamento, lucro ou retorno sobre o investimento.<\u002Fp>\n<a class=\"btn\" href=\"#cadastro\">QUERO ENTENDER COMO FUNCIONAM OS 50%<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SEÇÃO 6 | OPORTUNIDADE REGIONAL ================= -->\n<section class=\"on-yellow\" style=\"position: relative; overflow: hidden; background: #FCBF20; padding: 104px 24px 96px\">\n<div style=\"max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 56px; align-items: center\">\n<div>\n<p class=\"eyebrow\" style=\"color: #482683\">Oportunidade regional<\u002Fp>\n<h2 class=\"h2\">Sua cidade pode ser o ponto de partida do seu negócio.<\u002Fh2>\n<p class=\"p\">Quantas pessoas na sua região estão procurando uma oportunidade de especialização?<\u002Fp>\n<p class=\"p\">Profissionais da saúde, educação, administração, gestão, tecnologia e diversas outras áreas buscam formações para continuar desenvolvendo suas carreiras.<\u002Fp>\n<p class=\"p\" style=\"font-weight: 700\">Você pode construir uma presença comercial nesse mercado.<\u002Fp>\n<ul style=\"list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 12px\">\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #482683\"><span style=\"flex: none; width: 26px; height: 12px; border-radius: 99px; background: #482683; margin-top: 7px; transform: rotate(-30deg)\"><\u002Fspan>Estabelecer relacionamentos com profissionais, empresas e comunidades.<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #482683\"><span style=\"flex: none; width: 26px; height: 12px; border-radius: 99px; background: #482683; margin-top: 7px; transform: rotate(-30deg)\"><\u002Fspan>Desenvolver sua marca na região, por meio da rede.<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #482683\"><span style=\"flex: none; width: 26px; height: 12px; border-radius: 99px; background: #482683; margin-top: 7px; transform: rotate(-30deg)\"><\u002Fspan>Criar campanhas e conquistar oportunidades comerciais.<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #482683\"><span style=\"flex: none; width: 26px; height: 12px; border-radius: 99px; background: #482683; margin-top: 7px; transform: rotate(-30deg)\"><\u002Fspan>E tudo isso utilizando uma operação essencialmente digital.<\u002Fli>\n<\u002Ful>\n<p class=\"strong-line\" style=\"margin-top: 28px\">Você pode começar pela sua cidade e desenvolver uma atuação que alcance novos públicos.<\u002Fp>\n<p class=\"small\" style=\"margin: 20px 0 0; color: #482683\">A atuação territorial, eventuais exclusividades e as regras de divulgação dependerão das condições previstas no programa.<\u002Fp>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: relative; width: 100%; max-width: 400px; aspect-ratio: 1 / 1; margin: 0 auto\">\n<div style=\"position: absolute; left: 31.5%; top: 31.5%; width: 43.5%; height: 20.9%; border-radius: 999px; background: #482683; transform: translate(-50%, -50%) rotate(-45deg)\"><\u002Fdiv>\n<div style=\"position: absolute; left: 50%; top: 50%; width: 74%; height: 20.9%; border-radius: 999px; background: #24B094; transform: translate(-50%, -50%) rotate(-45deg)\"><\u002Fdiv>\n<div style=\"position: absolute; left: 68.5%; top: 68.5%; width: 65.2%; height: 20.9%; border-radius: 999px; background: #fff; transform: translate(-50%, -50%) rotate(-45deg)\"><\u002Fdiv>\n<div style=\"position: absolute; left: 16.3%; top: 65.2%; width: 32.6%; height: 20.9%; border-radius: 999px; background: #482683; transform: translate(-50%, -50%) rotate(45deg)\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SEÇÃO 7 | PARA QUEM É ================= -->\n<section style=\"background: #fff; padding: 104px 24px 96px\">\n<div style=\"max-width: 1180px; margin: 0 auto\">\n<div style=\"max-width: 860px; margin-bottom: 48px\">\n<p class=\"eyebrow\">Para quem é essa oportunidade<\u002Fp>\n<h2 class=\"h2\">Você não precisa ter experiência na educação. Precisa querer desenvolver um negócio.<\u002Fh2>\n<p class=\"p\" style=\"margin-bottom: 0\">A Rede Escola Digital foi pensada para pessoas que desejam empreender com estrutura, tecnologia e processos definidos.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 24px\">\n<article style=\"background: #F4F1FA; border-radius: 28px; padding: 32px\">\n<div style=\"width: 56px; height: 56px; border-radius: 99px; background: #FCBF20; display: flex; align-items: center; justify-content: center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#482683\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.5 6.5 19.5l1-6.3L3 8.9 9 8z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 class=\"card-title\">EMPREENDEDORES<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Você quer iniciar um novo negócio e procura uma oportunidade no mercado digital, com uma estrutura operacional organizada.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F4F1FA; border-radius: 28px; padding: 32px\">\n<div style=\"width: 56px; height: 56px; border-radius: 99px; background: #FCBF20; display: flex; align-items: center; justify-content: center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#482683\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"5\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"1\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n<h3 class=\"card-title\">PROFISSIONAIS DE VENDAS<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0 0 12px\">Você já sabe desenvolver relacionamentos, prospectar clientes e trabalhar com metas comerciais.<\u002Fp>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Agora pode avaliar a possibilidade de utilizar essa experiência no mercado educacional.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F4F1FA; border-radius: 28px; padding: 32px\">\n<div style=\"width: 56px; height: 56px; border-radius: 99px; background: #FCBF20; display: flex; align-items: center; justify-content: center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#482683\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11v2a1 1 0 0 0 1 1h3l8 4V6L7 10H4a1 1 0 0 0-1 1z\"><\u002Fpath><path d=\"M19 9a4 4 0 0 1 0 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 class=\"card-title\">AGÊNCIAS E PROFISSIONAIS DE MARKETING<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Você domina estratégias de divulgação, geração de leads e aquisição de clientes e deseja estudar uma nova frente de negócios.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F4F1FA; border-radius: 28px; padding: 32px\">\n<div style=\"width: 56px; height: 56px; border-radius: 99px; background: #FCBF20; display: flex; align-items: center; justify-content: center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#482683\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 9l1.5-5h15L21 9\"><\u002Fpath><path d=\"M3 9v11h18V9\"><\u002Fpath><path d=\"M9 20v-6h6v6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 class=\"card-title\">EMPRESÁRIOS E COMERCIANTES<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Você já possui experiência administrando negócios e quer diversificar suas atividades com uma operação digital.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F4F1FA; border-radius: 28px; padding: 32px\">\n<div style=\"width: 56px; height: 56px; border-radius: 99px; background: #FCBF20; display: flex; align-items: center; justify-content: center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#482683\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 9l10-5 10 5-10 5z\"><\u002Fpath><path d=\"M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 class=\"card-title\">ESCOLAS E EMPRESAS DE TREINAMENTO<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Você já atende profissionais que buscam desenvolvimento e quer conhecer um modelo de parceria comercial com uma rede educacional.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #482683; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; justify-content: center; gap: 14px\">\n<p style=\"margin: 0; font-size: 19px; line-height: 1.4; font-weight: 800; color: #fff\">Não é necessário ter uma faculdade, produzir cursos ou dominar todas as ferramentas desde o primeiro dia.<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: rgba(255,255,255,.92)\">Mas é importante compreender que se trata de um negócio: exige dedicação, planejamento, investimento e execução comercial.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SEÇÃO 8 | O QUE A REDE ENTREGA ================= -->\n<section class=\"on-dark\" style=\"position: relative; overflow: hidden; background: #482683; padding: 104px 24px 96px\">\n<div aria-hidden=\"true\" style=\"position: absolute; right: -120px; top: -50px; width: 480px; height: 100px; border-radius: 99px; background: #FCBF20; transform: rotate(-45deg); opacity: .18\"><\u002Fdiv>\n<div style=\"position: relative; max-width: 1180px; margin: 0 auto\">\n<div style=\"max-width: 820px; margin-bottom: 48px\">\n<p class=\"eyebrow\">O que a rede entrega<\u002Fp>\n<h2 class=\"h2\">Você não precisa fazer tudo sozinho.<\u002Fh2>\n<p class=\"h3\" style=\"margin-bottom: 0\">Uma estrutura para ajudar você a começar, operar e desenvolver seu negócio.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px\">\n<article style=\"background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 24px; padding: 28px\">\n<div style=\"font-size: 40px; font-weight: 800; color: #FCBF20; line-height: 1\">01<\u002Fdiv>\n<h3 class=\"card-title\" style=\"color: #fff; margin-top: 18px\">MARCA E IDENTIDADE COMERCIAL<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Você passa a integrar uma rede com identidade visual, posicionamento e materiais padronizados.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 24px; padding: 28px\">\n<div style=\"font-size: 40px; font-weight: 800; color: #FCBF20; line-height: 1\">02<\u002Fdiv>\n<h3 class=\"card-title\" style=\"color: #fff; margin-top: 18px\">SITE E PÁGINAS DE VENDAS<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Ambiente digital preparado para apresentar o catálogo de cursos e captar interessados.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 24px; padding: 28px\">\n<div style=\"font-size: 40px; font-weight: 800; color: #FCBF20; line-height: 1\">03<\u002Fdiv>\n<h3 class=\"card-title\" style=\"color: #fff; margin-top: 18px\">PORTFÓLIO DE PÓS-GRADUAÇÕES<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Cursos disponibilizados pela UniEficaz conforme as regras e condições da parceria.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 24px; padding: 28px\">\n<div style=\"font-size: 40px; font-weight: 800; color: #FCBF20; line-height: 1\">04<\u002Fdiv>\n<h3 class=\"card-title\" style=\"color: #fff; margin-top: 18px\">PLATAFORMA E JORNADA DO ALUNO<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Integração com os processos e sistemas utilizados pela instituição de ensino superior responsável pela oferta.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 24px; padding: 28px\">\n<div style=\"font-size: 40px; font-weight: 800; color: #FCBF20; line-height: 1\">05<\u002Fdiv>\n<h3 class=\"card-title\" style=\"color: #fff; margin-top: 18px\">INTEGRAÇÃO COM PAGAMENTOS<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Soluções tecnológicas para apoiar os processos de contratação e pagamento definidos pela rede.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 24px; padding: 28px\">\n<div style=\"font-size: 40px; font-weight: 800; color: #FCBF20; line-height: 1\">06<\u002Fdiv>\n<h3 class=\"card-title\" style=\"color: #fff; margin-top: 18px\">FERRAMENTAS DE GESTÃO COMERCIAL<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Recursos para organizar oportunidades, acompanhar resultados e monitorar o desenvolvimento do negócio.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 24px; padding: 28px\">\n<div style=\"font-size: 40px; font-weight: 800; color: #FCBF20; line-height: 1\">07<\u002Fdiv>\n<h3 class=\"card-title\" style=\"color: #fff; margin-top: 18px\">TREINAMENTO DE IMPLANTAÇÃO<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Orientação inicial para conhecer a rede, utilizar as ferramentas e compreender os processos comerciais.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 24px; padding: 28px\">\n<div style=\"font-size: 40px; font-weight: 800; color: #FCBF20; line-height: 1\">08<\u002Fdiv>\n<h3 class=\"card-title\" style=\"color: #fff; margin-top: 18px\">SUPORTE E ACOMPANHAMENTO<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Canais de suporte para os recursos tecnológicos e operacionais contratados.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<div style=\"margin-top: 48px; display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap\">\n<p class=\"strong-line\" style=\"margin: 0; max-width: 640px\">A estrutura para começar está organizada. O crescimento será construído por você.<\u002Fp>\n<a class=\"btn\" href=\"#cadastro\">QUERO FAZER PARTE DA REDE<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SEÇÃO 9 | PARCERIA ACADÊMICA ================= -->\n<section style=\"background: #F4F1FA; padding: 104px 24px 96px\">\n<div style=\"max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 56px; align-items: center\">\n<div>\n<p class=\"eyebrow\">Parceria acadêmica<\u002Fp>\n<h2 class=\"h2\">Uma rede de negócios com uma instituição de ensino superior por trás da oferta acadêmica.<\u002Fh2>\n<p class=\"h3\" style=\"font-weight: 800; color: #482683\">Conheça a UniEficaz.<\u002Fp>\n<p class=\"p\">Na Rede Escola Digital, os cursos de pós-graduação são ofertados academicamente pela UniEficaz, conforme seu catálogo, suas condições institucionais e a legislação aplicável.<\u002Fp>\n<p class=\"p\">Isso significa que a instituição de ensino superior é responsável pelos elementos acadêmicos das especializações, incluindo projetos pedagógicos, corpo docente, gestão acadêmica, avaliações e emissão dos certificados.<\u002Fp>\n<p class=\"p\">A rede e seus parceiros atuam nas atividades comerciais e tecnológicas que forem expressamente autorizadas e contratadas.<\u002Fp>\n<p class=\"p\">Essa divisão de responsabilidades permite que cada participante concentre sua atuação naquilo que lhe compete.<\u002Fp>\n<p class=\"strong-line\">Uma estrutura comercial organizada, conectada a uma operação acadêmica institucional.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #fff; border-radius: 32px; padding: clamp(26px, 4vw, 44px); box-shadow: 0 20px 50px rgba(72,38,131,.12)\">\n<img src=\"714efe58-cb04-4e12-ba4d-ae423e0a0a9d\" alt=\"UniEficaz Centro Universitário\" style=\"height: 64px; width: auto; display: block; margin-bottom: 28px\">\n<div style=\"display: grid; gap: 16px\">\n<div style=\"background: #482683; border-radius: 22px; padding: 24px 26px\">\n<p style=\"margin: 0 0 8px; font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #FCBF20\">Instituição de ensino superior<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #fff\">Projetos pedagógicos, corpo docente, gestão acadêmica, avaliações e emissão dos certificados.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #F0EAFB; border-radius: 22px; padding: 24px 26px\">\n<p style=\"margin: 0 0 8px; font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #482683\">A rede e seus parceiros<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3B3550\">Atividades comerciais e tecnológicas expressamente autorizadas e contratadas.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SEÇÃO 10 | COMO COMEÇAR ================= -->\n<section id=\"como-comecar\" style=\"background: #fff; padding: 104px 24px 96px\">\n<div style=\"max-width: 1180px; margin: 0 auto\">\n<div style=\"max-width: 820px; margin-bottom: 48px\">\n<p class=\"eyebrow\">Como começar<\u002Fp>\n<h2 class=\"h2\" style=\"margin-bottom: 0\">Conheça o caminho para entrar na rede.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 24px\">\n<article style=\"border: 2px solid #E4DDF2; border-radius: 28px; padding: 32px\">\n<span style=\"display: inline-block; padding: 6px 16px; border-radius: 99px; background: #FCBF20; color: #482683; font-size: 13px; font-weight: 800; letter-spacing: .08em\">ETAPA 1<\u002Fspan>\n<h3 class=\"card-title\" style=\"font-size: 17px\">CONHEÇA A OPORTUNIDADE<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Preencha o formulário de interesse e converse com nossa equipe para entender como a Rede Escola Digital funciona.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 2px solid #E4DDF2; border-radius: 28px; padding: 32px\">\n<span style=\"display: inline-block; padding: 6px 16px; border-radius: 99px; background: #FCBF20; color: #482683; font-size: 13px; font-weight: 800; letter-spacing: .08em\">ETAPA 2<\u002Fspan>\n<h3 class=\"card-title\" style=\"font-size: 17px\">AVALIAÇÃO DO PERFIL<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Vamos conhecer sua experiência, sua região, seus objetivos e sua disponibilidade para desenvolver o negócio.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 2px solid #E4DDF2; border-radius: 28px; padding: 32px\">\n<span style=\"display: inline-block; padding: 6px 16px; border-radius: 99px; background: #FCBF20; color: #482683; font-size: 13px; font-weight: 800; letter-spacing: .08em\">ETAPA 3<\u002Fspan>\n<h3 class=\"card-title\" style=\"font-size: 17px\">APRESENTAÇÃO DO MODELO COMERCIAL<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Você terá acesso às informações sobre estrutura, investimento de implantação, mensalidade, serviços disponíveis e condições de participação.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 2px solid #E4DDF2; border-radius: 28px; padding: 32px\">\n<span style=\"display: inline-block; padding: 6px 16px; border-radius: 99px; background: #FCBF20; color: #482683; font-size: 13px; font-weight: 800; letter-spacing: .08em\">ETAPA 4<\u002Fspan>\n<h3 class=\"card-title\" style=\"font-size: 17px\">FORMALIZAÇÃO DA PARCERIA<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Após a avaliação e aprovação, serão apresentados os documentos e procedimentos contratuais aplicáveis.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 2px solid #E4DDF2; border-radius: 28px; padding: 32px\">\n<span style=\"display: inline-block; padding: 6px 16px; border-radius: 99px; background: #FCBF20; color: #482683; font-size: 13px; font-weight: 800; letter-spacing: .08em\">ETAPA 5<\u002Fspan>\n<h3 class=\"card-title\" style=\"font-size: 17px\">IMPLANTAÇÃO E TREINAMENTO<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Sua operação comercial será configurada conforme os recursos contratados, e você receberá treinamento para utilizar as ferramentas da rede.<\u002Fp>\n<\u002Farticle>\n<article style=\"border: 2px solid #E4DDF2; border-radius: 28px; padding: 32px\">\n<span style=\"display: inline-block; padding: 6px 16px; border-radius: 99px; background: #482683; color: #fff; font-size: 13px; font-weight: 800; letter-spacing: .08em\">ETAPA 6<\u002Fspan>\n<h3 class=\"card-title\" style=\"font-size: 17px\">INÍCIO DA OPERAÇÃO<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Com os acessos e processos disponíveis, você poderá iniciar as atividades comerciais autorizadas e desenvolver sua carteira de interessados.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<div style=\"margin-top: 48px; display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap\">\n<p class=\"strong-line\" style=\"margin: 0; max-width: 640px\">Você começa com estrutura. E desenvolve o negócio com seu próprio trabalho.<\u002Fp>\n<a class=\"btn btn-purple\" href=\"#cadastro\">QUERO INICIAR MINHA AVALIAÇÃO<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SEÇÃO 11 | CONDIÇÃO DE ENTRADA ================= -->\n<section style=\"background: #F4F1FA; padding: 104px 24px 96px\">\n<div style=\"max-width: 1180px; margin: 0 auto\">\n<div style=\"max-width: 820px; margin-bottom: 48px\">\n<p class=\"eyebrow\">Conheça a condição de entrada<\u002Fp>\n<h2 class=\"h2\">Um investimento para construir seu negócio na educação digital.<\u002Fh2>\n<p class=\"p\">Ingressar na Rede Escola Digital envolve a contratação da estrutura de implantação e dos serviços contínuos de tecnologia e suporte.<\u002Fp>\n<p class=\"p\" style=\"margin-bottom: 0\">O modelo comercial contempla duas modalidades de cobrança.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 24px\">\n<article style=\"background: #fff; border-radius: 28px; padding: clamp(28px, 4vw, 40px); border: 1px solid #E4DDF2\">\n<div style=\"width: 56px; height: 56px; border-radius: 18px; background: #F0EAFB; display: flex; align-items: center; justify-content: center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#482683\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 8l-9-5-9 5v8l9 5 9-5z\"><\u002Fpath><path d=\"M3 8l9 5 9-5M12 13v8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 class=\"card-title\">INVESTIMENTO DE IMPLANTAÇÃO<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Valor destinado aos serviços de configuração, disponibilização das ferramentas previstas no contrato, treinamento inicial e ativação da operação.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #fff; border-radius: 28px; padding: clamp(28px, 4vw, 40px); border: 1px solid #E4DDF2\">\n<div style=\"width: 56px; height: 56px; border-radius: 18px; background: #F0EAFB; display: flex; align-items: center; justify-content: center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#482683\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M3 10h18M8 3v4M16 3v4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 class=\"card-title\">MENSALIDADE OPERACIONAL<\u002Fh3>\n<p class=\"p\" style=\"font-size: 16px; margin: 0\">Valor recorrente referente aos recursos tecnológicos, manutenção e serviços de suporte contemplados no plano contratado.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<div style=\"margin-top: 40px; background: #482683; border-radius: 32px; padding: clamp(28px, 4vw, 48px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 28px 48px; align-items: center\">\n<div>\n<p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.65; color: rgba(255,255,255,.92)\">Os valores, condições e obrigações serão apresentados individualmente aos candidatos interessados, de acordo com o modelo comercial aprovado.<\u002Fp>\n<p style=\"margin: 0 0 6px; font-size: clamp(20px, 2.2vw, 26px); line-height: 1.3; font-weight: 800; color: #fff\">Quer conhecer o investimento necessário para começar?<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: rgba(255,255,255,.92)\">Solicite uma apresentação e converse com nossa equipe.<\u002Fp>\n<\u002Fdiv>\n<div><a class=\"btn\" href=\"#cadastro\">QUERO CONHECER OS VALORES E CONDIÇÕES<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SEÇÃO 12 | CAPTAÇÃO DE PARCEIROS ================= -->\n<section id=\"cadastro\" class=\"on-dark\" style=\"position: relative; overflow: hidden; background: #482683; padding: 104px 24px 96px\">\n<div aria-hidden=\"true\" style=\"position: absolute; left: -160px; top: 40px; width: 520px; height: 100px; border-radius: 99px; background: #24B094; transform: rotate(-45deg); opacity: .2\"><\u002Fdiv>\n<div style=\"position: relative; max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 56px; align-items: start\">\n<div>\n<p class=\"eyebrow\">Captação de parceiros<\u002Fp>\n<h2 class=\"h2\">O próximo negócio que você vai construir <span class=\"hl\">pode ser na educação.<\u002Fspan><\u002Fh2>\n<p class=\"h3\">Descubra se o modelo de Escola Digital combina com seu perfil.<\u002Fp>\n<p class=\"p\">Estamos estruturando uma rede para empreendedores que desejam atuar no mercado educacional com tecnologia, processos e uma operação comercial organizada.<\u002Fp>\n<p class=\"p\">Se você acredita que pode desenvolver esse negócio na sua cidade ou região, queremos conhecer seu perfil.<\u002Fp>\n<p class=\"strong-line\">Preencha o formulário e solicite uma apresentação.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #fff; border-radius: 32px; padding: clamp(24px, 4vw, 40px); box-shadow: 0 24px 60px rgba(20,8,50,.35)\">\n<form sc-camel-on-submit=\"{{noop}}\" style=\"display: grid; gap: 22px\" aria-label=\"Formulário de interesse\">\n<div class=\"field\">\n<label class=\"field-label\" for=\"f-nome\">Nome completo<\u002Flabel>\n<input class=\"input\" id=\"f-nome\" type=\"text\" name=\"nome\" autocomplete=\"name\" required=\"\">\n<\u002Fdiv>\n<div class=\"field\">\n<label class=\"field-label\" for=\"f-email\">E-mail<\u002Flabel>\n<input class=\"input\" id=\"f-email\" type=\"email\" name=\"email\" autocomplete=\"email\" required=\"\">\n<\u002Fdiv>\n<div class=\"field\">\n<label class=\"field-label\" for=\"f-whats\">WhatsApp com DDD<\u002Flabel>\n<input class=\"input\" id=\"f-whats\" type=\"tel\" name=\"whatsapp\" autocomplete=\"tel\" required=\"\">\n<\u002Fdiv>\n<div class=\"field\">\n<label class=\"field-label\" for=\"f-cidade\">Cidade e estado<\u002Flabel>\n<input class=\"input\" id=\"f-cidade\" type=\"text\" name=\"cidade\" autocomplete=\"address-level2\" required=\"\">\n<\u002Fdiv>\n<fieldset class=\"field\">\n<legend class=\"field-label\" style=\"padding: 0; margin-bottom: 8px\">Qual é sua experiência profissional?<\u002Flegend>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"experiencia\" value=\"empresario\"> Sou empresário ou empreendedor<\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"experiencia\" value=\"vendas\"> Trabalho com vendas<\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"experiencia\" value=\"marketing\"> Trabalho com marketing digital<\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"experiencia\" value=\"escola\"> Tenho uma escola ou empresa de treinamentos<\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"experiencia\" value=\"primeiro-negocio\"> Quero iniciar meu primeiro negócio<\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"experiencia\" value=\"outro\"> Outro<\u002Flabel>\n<\u002Fdiv>\n<\u002Ffieldset>\n<fieldset class=\"field\">\n<legend class=\"field-label\" style=\"padding: 0; margin-bottom: 8px\">Você possui experiência com vendas ou marketing?<\u002Flegend>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"vendas-marketing\" value=\"sim\"> Sim, tenho experiência<\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"vendas-marketing\" value=\"alguma\"> Tenho alguma experiência<\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"vendas-marketing\" value=\"nao\"> Ainda não, mas quero aprender<\u002Flabel>\n<\u002Fdiv>\n<\u002Ffieldset>\n<fieldset class=\"field\">\n<legend class=\"field-label\" style=\"padding: 0; margin-bottom: 8px\">Quando pretende começar?<\u002Flegend>\n<div class=\"opts\">\n<label class=\"opt\"><input type=\"radio\" name=\"quando\" value=\"imediato\"> O quanto antes<\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"quando\" value=\"3-meses\"> Nos próximos 3 meses<\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"quando\" value=\"3-6-meses\"> Entre 3 e 6 meses<\u002Flabel>\n<label class=\"opt\"><input type=\"radio\" name=\"quando\" value=\"pesquisando\"> Estou pesquisando<\u002Flabel>\n<\u002Fdiv>\n<\u002Ffieldset>\n<button class=\"btn btn-purple\" type=\"submit\" style=\"width: 100%\">QUERO CONHECER A OPORTUNIDADE<\u002Fbutton>\n<p class=\"small\" style=\"margin: 0; font-style: italic; color: #5A5370\">O preenchimento não garante aprovação para ingresso na rede. A contratação depende de avaliação, disponibilidade, formalização e condições aplicáveis ao programa.<\u002Fp>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SEÇÃO 13 | FAQ ================= -->\n<section id=\"faq\" style=\"background: #fff; padding: 104px 24px 96px\">\n<div style=\"max-width: 920px; margin: 0 auto\">\n<div style=\"margin-bottom: 32px\">\n<p class=\"eyebrow\">Dúvidas<\u002Fp>\n<h2 class=\"h2\" style=\"margin-bottom: 0\">Perguntas frequentes<\u002Fh2>\n<\u002Fdiv>\n<div class=\"faq\" style=\"min-width: 0\">\n<details>\n<summary>1. Preciso ser professor ou ter uma faculdade para participar?<\u002Fsummary>\n<div class=\"answer\">\n<p>Não é necessário ser professor ou proprietário de uma instituição de ensino superior para desenvolver uma atividade comercial no setor educacional.<\u002Fp>\n<p>A Rede Escola Digital é voltada a empreendedores interessados em atuar nas atividades permitidas pelo programa de parceria.<\u002Fp>\n<p>A oferta acadêmica dos cursos é de responsabilidade da UniEficaz.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<details>\n<summary>2. Os cursos já estarão disponíveis?<\u002Fsummary>\n<div class=\"answer\">\n<p>A proposta contempla o acesso ao catálogo de pós-graduações existentes da UniEficaz que forem disponibilizadas e autorizadas para o programa.<\u002Fp>\n<p>A lista de cursos será apresentada durante o processo de avaliação comercial.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<details>\n<summary>3. Preciso gravar aulas ou produzir conteúdos?<\u002Fsummary>\n<div class=\"answer\">\n<p>Não. O modelo é desenvolvido a partir de um catálogo acadêmico já existente.<\u002Fp>\n<p>O parceiro não será responsável pela produção dos cursos nem pelas atividades acadêmicas da instituição.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<details>\n<summary>4. Vou ter meu próprio site?<\u002Fsummary>\n<div class=\"answer\">\n<p>A proposta contempla o acesso a um ambiente comercial padronizado, com páginas e recursos definidos pela rede.<\u002Fp>\n<p>As condições de personalização, identificação do parceiro e funcionamento do ambiente serão explicadas na apresentação.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<details>\n<summary>5. Como funciona a participação de 50%?<\u002Fsummary>\n<div class=\"answer\">\n<p>O modelo proposto prevê remuneração de 50% sobre o faturamento elegível das vendas atribuídas ao parceiro, conforme os serviços autorizados, a base de cálculo e as condições previstas em contrato.<\u002Fp>\n<p>A estrutura definitiva depende de validação jurídica e aprovação das partes envolvidas.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<details>\n<summary>6. Preciso investir em anúncios?<\u002Fsummary>\n<div class=\"answer\">\n<p>A divulgação é uma das formas de desenvolver a operação comercial.<\u002Fp>\n<p>O investimento em marketing, os canais permitidos e os materiais disponibilizados serão definidos conforme as regras da rede.<\u002Fp>\n<p>Não existe garantia de vendas apenas por ingressar no programa.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<details>\n<summary>7. Posso atuar na minha cidade?<\u002Fsummary>\n<div class=\"answer\">\n<p>A proposta é permitir o desenvolvimento comercial em diferentes regiões.<\u002Fp>\n<p>A abrangência territorial, eventuais exclusividades e os limites de atuação serão definidos contratualmente.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<details>\n<summary>8. Quem emite os certificados dos alunos?<\u002Fsummary>\n<div class=\"answer\">\n<p>A instituição de ensino superior responsável pela oferta acadêmica, observados os requisitos legais e a conclusão regular da especialização.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<details>\n<summary>9. Vou precisar contratar funcionários?<\u002Fsummary>\n<div class=\"answer\">\n<p>Isso depende do porte e da estratégia comercial que você pretende desenvolver.<\u002Fp>\n<p>O modelo inicial foi pensado para uma operação digital enxuta, mas cada empreendedor precisará avaliar suas necessidades e custos.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<details>\n<summary>10. Existe garantia de faturamento?<\u002Fsummary>\n<div class=\"answer\">\n<p>Não. Como em qualquer negócio, os resultados dependem de mercado, dedicação, investimento, planejamento, capacidade comercial e outros fatores.<\u002Fp>\n<p>A rede fornece os recursos contratados, mas não garante vendas ou retorno financeiro.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<details>\n<summary>11. Quanto custa participar?<\u002Fsummary>\n<div class=\"answer\">\n<p>O programa contempla investimento inicial de implantação e mensalidade de serviços.<\u002Fp>\n<p>As condições comerciais serão apresentadas durante a avaliação, juntamente com os recursos disponíveis, responsabilidades e obrigações contratuais.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<details>\n<summary>12. Como faço para começar?<\u002Fsummary>\n<div class=\"answer\">\n<p>Preencha o formulário de interesse.<\u002Fp>\n<p>Nossa equipe poderá entrar em contato para apresentar o modelo, conhecer seu perfil e explicar os próximos passos.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SEÇÃO 14 | CHAMADA FINAL ================= -->\n<section class=\"on-yellow\" style=\"position: relative; overflow: hidden; background: #FCBF20; padding: 112px 24px 104px\">\n<div aria-hidden=\"true\" style=\"position: absolute; right: -110px; top: 30px; width: 460px; height: 96px; border-radius: 99px; background: #482683; transform: rotate(-45deg)\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; left: -150px; bottom: 10px; width: 440px; height: 90px; border-radius: 99px; background: #24B094; transform: rotate(-45deg)\"><\u002Fdiv>\n<div style=\"position: relative; max-width: 860px; margin: 0 auto; text-align: center\">\n<h2 class=\"h2\" style=\"font-size: clamp(28px, 4vw, 48px); font-weight: 800; margin-bottom: 32px\">VOCÊ PODE CONTINUAR PROCURANDO UMA OPORTUNIDADE. OU COMEÇAR A PLANEJAR SEU PRÓXIMO NEGÓCIO.<\u002Fh2>\n<p class=\"p\">Construir um negócio exige decisões.<\u002Fp>\n<p class=\"p\">Escolher um mercado, organizar uma estrutura, investir em ferramentas, conquistar clientes e desenvolver uma operação.<\u002Fp>\n<p class=\"p\">Na Rede Escola Digital, nossa proposta é oferecer a base tecnológica e comercial para quem deseja empreender no mercado da educação continuada.<\u002Fp>\n<p class=\"p\">Com um catálogo de pós-graduações disponibilizado pela UniEficaz, ferramentas de gestão e suporte à operação, você poderá avaliar a possibilidade de desenvolver um negócio educacional em sua região.<\u002Fp>\n<p class=\"strong-line\" style=\"margin-bottom: 28px\">A estrutura é o ponto de partida. O crescimento depende de você.<\u002Fp>\n<h3 style=\"margin: 0 0 32px; font-size: clamp(20px, 2.4vw, 28px); line-height: 1.25; font-weight: 800; color: #482683\">TENHA SUA ESCOLA DIGITAL. DESENVOLVA SEU NEGÓCIO NA EDUCAÇÃO.<\u002Fh3>\n<a class=\"btn btn-purple\" href=\"#cadastro\">QUERO SER UM PARCEIRO DE NEGÓCIOS<\u002Fa>\n<p class=\"small\" style=\"margin: 18px 0 0; font-style: italic; color: #482683\">Solicite uma apresentação e conheça as condições da Rede Escola Digital.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<!-- ================= RODAPÉ ================= -->\n<footer class=\"on-dark\" style=\"background: #482683; padding: 72px 24px 40px\">\n<div style=\"max-width: 1180px; margin: 0 auto\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 40px; align-items: start\">\n<div>\n<img src=\"1e5f5f91-dc82-4cf2-bee2-5ed294be95ed\" alt=\"UniEficaz Centro Universitário\" style=\"height: 48px; width: auto; display: block; margin-bottom: 24px\">\n<p style=\"margin: 0 0 10px; font-size: 18px; font-weight: 800; color: #fff\">Rede Escola Digital<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: rgba(255,255,255,.92)\">Programa de desenvolvimento de negócios educacionais com estrutura tecnológica, serviços comerciais e parceria acadêmica com a UniEficaz.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; gap: 12px\">\n<p style=\"margin: 0; font-size: 13px; line-height: 1.65; color: rgba(255,255,255,.88)\">A oferta dos cursos de pós-graduação, a gestão acadêmica e a emissão dos certificados são de responsabilidade da instituição de ensino superior ofertante.<\u002Fp>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.65; color: rgba(255,255,255,.88)\">As condições de participação, remuneração, implantação e mensalidade dependem da formalização e aprovação dos contratos aplicáveis.<\u002Fp>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.65; color: rgba(255,255,255,.88)\">A adesão ao programa não garante faturamento, lucratividade ou retorno sobre o investimento.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 48px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,.2); display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap\">\n<nav aria-label=\"Links institucionais\" style=\"display: flex; gap: 8px 28px; flex-wrap: wrap\">\n<a class=\"footer-link\" href=\"#topo\">Política de Privacidade<\u002Fa>\n<a class=\"footer-link\" href=\"#topo\">Termos de Uso<\u002Fa>\n<a class=\"footer-link\" href=\"#cadastro\">Fale Conosco<\u002Fa>\n<\u002Fnav>\n<p style=\"margin: 0; font-size: 13px; color: rgba(255,255,255,.88)\">© 2026. Todos os direitos reservados.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<!-- ================= BOTÃO WHATSAPP ================= -->\n<a class=\"wa-float\" href=\"https://wa.me/554499922804?text=Ol%C3%A1!%20Quero%20conhecer%20a%20Rede%20Escola%20Digital.\" target=\"_blank\" rel=\"noopener\" aria-label=\"Falar com a nossa equipe pelo WhatsApp\">\n<svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"#fff\" aria-hidden=\"true\"><path d=\"M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.19
